<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The above 3 meta tags *must* come first in the head any other head content must come *after* these tags -->
  <meta name="description" content="">
  <meta name="author" content="">
  <link rel="icon" href="../../favicon.ico">

  <title>Home Energy Management</title>

  <!-- Bootstrap core CSS -->
  <link href="css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom styles for this template -->
  <link href="css/cover.css" rel="stylesheet">

  <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
  <!--[if lt IE 9]>
      <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
      <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body>

  <div class="site-wrapper">

    <div class="site-wrapper-inner">

      <div class="cover-container">

        <div class="masthead clearfix">
          <div class="inner">
            <h3 class="masthead-brand">Thermostat</h3>
            <!--               <nav>
                <ul class="nav masthead-nav">
                  <li class="active"><a href="#">Home</a></li>
                  <li><a href="#">Features</a></li>
                  <li><a href="#">Contact</a></li>
                </ul>
              </nav> -->
          </div>
        </div>

        <div class="inner cover">
          <span id="temp"></span>
          <div id="source"></div>
          <div>
            <span id="rh"></span>
            <span id="di"></span>
            <span id="out"></span>
            <span id="state"></span>
          </div>
          <h3><span class="text-info">Cool</span> Setpoint</h3>
          <div>
            <span class="control btn btn-default btn-xs glyphicon glyphicon-minus disabled" id="coolSetDown"></span>
            <span id="coolSet"></span>
            <span class="control btn btn-default btn-xs glyphicon glyphicon-plus disabled" id="coolSetUp"></span>
          </div>
          <h3><span class="text-danger">Heat</span> Setpoint</h3>
          <div>
            <span class="control btn btn-default btn-xs glyphicon glyphicon-minus disabled" id="heatSetDown"></span>
            <span id="heatSet"></span>
            <span class="control btn btn-default btn-xs glyphicon glyphicon-plus disabled" id="heatSetUp"></span>
          </div>
          <h3>HVAC Mode</h3>
          <div>
            <p><span class="disabled btn btn-info" id="cool">Cool</span>
              <span class="disabled btn btn-default" id="off">Off</span>
              <span class="disabled btn btn-danger" id="heat">Heat</span>
            </p>
            <p id="modeStatus" role="status">Mode unavailable</p>
          </div>
        </div>
        <div class="mastfoot">
          <div class="inner">
            <p>Home Energy Management</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap core JavaScript
    ================================================== -->
  <!-- Placed at the end of the document so the pages load faster -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/bootstrap.min.js"></script>
  <script src="js/mqtt.min.js"></script>
  <script src="js/hvac-mode.js"></script>

  <script>
    $(function () {

      let timer = 0

      setInterval(function(){
        timer += 1
        if (timer > 100) timer = 100
        $("#temp").css("color", "rgb(" + Math.floor(255 - 0.86 * timer)  + "," + Math.floor(255 - 1.87 * timer) + "," + Math.floor(255 - 1.89 * timer) +")")
//        console.log (timer)
      }, 150)

      let temp = []

      let client = mqtt.connect("ws://192.168.144.2:9001")
      const mode = HvacMode.createTracker(({ confirmed, pending, notice }) => {
        $("#cool, #heat, #off").removeClass("disabled");
        if (confirmed) $("#" + confirmed).addClass("disabled");
        $("#modeStatus").text(pending ? "Requested " + pending + "; awaiting controller" :
          (notice || (confirmed === "fan" ? "Mode: Fan (no fan button)" : "Mode: " + confirmed)));
      });
//let host = window.location.host;
//let client = mqtt.connect("ws://" + host + ":9001");



      client.on("error", function (err) {
        console.log(err)
      })

      client.on("connect", function () {
        mode.connect();
        client.subscribe("hvac/+", function (err) {
          if (err) { mode.disconnect(); return; }
          client.publish("hvac/mode", "?");
        })
        client.subscribe("temp/room1/tempF")
        client.subscribe("temp/room1/rh")
        client.subscribe("temp/284a046d4c2001a3")
        client.publish("hvac/coolSet", "?")
        client.publish("hvac/heatSet", "?")
      })

      client.on("close", () => mode.disconnect());
      client.on("offline", () => mode.disconnect());

      client.on("message", function (topic, message, packet) {
        mode.receive(topic, message.toString(), packet);

        temp[topic] = message.toString()

        switch (topic) {
          case "hvac/state":
            $("#state").html("<p>" + message.toString() + "</p>");
            break;
          case "hvac/controlTempF":
            $("#temp").html("<h1 class=\"cover-heading\">" + parseFloat(message.toString()).toFixed(1) + " F</h1>")
            timer = 0
            break
          case "hvac/tempSource":
            $("#source").html("<p style='color:#a0aec0;font-size:0.85em;margin:0;'>Source: " + message.toString() + "</p>")
            break
          case "temp/room1/tempF":
            if (!temp["hvac/controlTempF"]) {
              $("#temp").html("<h1 class=\"cover-heading\">" + parseFloat(message.toString()).toFixed(1) + " F</h1>")
              timer = 0
            }
            break
          case "temp/room1/rh":
            $("#rh").html("<p>Humidity: " + message.toString() + " %</p>")
            break
          case "temp/284a046d4c2001a3":
            $("#out").html("<p>Outdoor Temp: " + message.toString() + " F </p>")
            break
          case "hvac/coolSet":
            if (message.toString() == "?") break
            if (Number(message.toString()) < 58) {
              client.publish("hvac/coolSet", "60")
            }
            if (Number(message.toString()) > 85) {
              client.publish("hvac/coolSet", "85")
            }
            $("#coolSet").html(message.toString())
            setTimeout(function () {
              $(".control").removeClass("disabled")
            }, 250)
            break
          case "hvac/heatSet":
            if (message.toString() == "?") break
            if (Number(message.toString()) < 58) {
              client.publish("hvac/heatSet", "60")
            }
            if (Number(message.toString()) > 85) {
              client.publish("hvac/heatSet", "85")
            }
            $("#heatSet").html(message.toString())
            setTimeout(function () {
              $(".control").removeClass("disabled")
            }, 250)
            break
        }
      })

      $("#coolSetDown").click(function () {
        $(".control").addClass("disabled")
        client.publish("hvac/coolSet", (Number(temp["hvac/coolSet"]) - 1).toString())
        client.publish("hvac/coolSet", "?")
      })

      $("#coolSetUp").click(function () {
        $(".control").addClass("disabled")
        client.publish("hvac/coolSet", (Number(temp["hvac/coolSet"]) + 1).toString())
        client.publish("hvac/coolSet", "?")
      })

      $("#heatSetDown").click(function () {
        $(".control").addClass("disabled")
        client.publish("hvac/heatSet", (Number(temp["hvac/heatSet"]) - 1).toString())
        client.publish("hvac/heatSet", "?")
      })

      $("#heatSetUp").click(function () {
        $(".control").addClass("disabled")
        client.publish("hvac/heatSet", (Number(temp["hvac/heatSet"]) + 1).toString())
        client.publish("hvac/heatSet", "?")
      })

      $("#heat").click(function () {
        mode.request("heat", (topic, value) => client.publish(topic, value))
      })

      $("#cool").click(function () {
        mode.request("cool", (topic, value) => client.publish(topic, value))
      })

      $("#off").click(function () {
        mode.request("off", (topic, value) => client.publish(topic, value))
      })



    })
  </script>
</body>

</html>
