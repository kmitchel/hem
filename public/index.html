<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Home Energy Monitor</title>
    <style>
        img { cursor: pointer; display: block; margin-bottom: 10px; }
    </style>
<link rel="stylesheet" href="sensor-status.css">
<script src="js/sensor-status.js" defer></script>
</head>

<body>
    <p><a href="chart.html">Room and sensor charts</a></p>
    <span id="power"></span><br>
    <span id="kWh"></span><br>
    <span id="t"></span><br>
    <span id="out"></span><br>
    <span id="upper"></span><br>
    <span id="lower"></span><br>
    <span id="achigh">AC high side: Awaiting replacement</span><br>
    <span id="aclow">AC low side: Awaiting replacement</span><br>
    <span id="gal"></span><br>
    <span id="gpm"></span><br>
    <span id="rh"></span><br>
    <span id="dew"></span><br>
    <span id="state"></span><br>
    <span id="cool"></span><br>
    <span id="heat"></span><br>

    <img id="watt2" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="temp2" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="ac2" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="wh2" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="gpm2" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="watt24" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="temp24" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="ac24" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="wh24" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="gpm24" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="watt96" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="temp96" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="ac96" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="wh96" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">
    <img id="gpm96" width="1080" height="240" style="width: 100%; height: auto" src="blank.png" alt="">

    <script src="js/mqtt.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const time = () => Math.floor(Date.now() / 1000 / 30) * 60 * 1000;

            const updateImg = (id, type, temp, start) => {
                const el = document.getElementById(id);
                if (el) el.src = `/graph/${type}?${temp}&start=${start}`;
            };

            const loadImg = (temp) => {
                const graphs = ['watt', 'temp', 'ac', 'wh', 'gpm'];
                const periods = { '2': '12h', '24': '48h', '96': '96h' };

                Object.entries(periods).forEach(([suffix, startValue]) => {
                    graphs.forEach(type => {
                        updateImg(type + suffix, type, temp, startValue);
                    });
                });
            };

            // Initial load
            loadImg(time());

            // Refresh on click for all images
            document.querySelectorAll('img').forEach(img => {
                img.addEventListener('click', () => loadImg(time()));
            });

            // Auto-refresh every 30 seconds
            setInterval(() => loadImg(time()), 30000);

            // MQTT Connection
            const host = window.location.hostname;
            const client = mqtt.connect(`ws://${host}:9001`);
//console.log(client)

            client.on("error", (err) => {
                console.error("MQTT Error:", err);
                client.end();
            });

            client.on("connect", () => {
                console.log("Connected to MQTT broker");
                client.subscribe("#");
            });

            client.on("message", (topic, message) => {
                const msgStr = message.toString();
                const updateHTML = (id, val) => {
                    const el = document.getElementById(id);
                    if (el) el.innerHTML = val;
                };

                switch (topic) {
                    case "hvac/state": updateHTML("state", msgStr); break;
                    case "power/W": updateHTML("power", `Current Power: ${msgStr}W`); break;
                    case "temp/284a046d4c2001a3": updateHTML("out", `Outside Temp: ${msgStr}F`); break;
                    case "temp/2809853f030000a7": updateHTML("upper", `Upper WH Temp: ${msgStr}F`); break;
                    case "temp/2813513f03000072": updateHTML("lower", `Lower WH Temp: ${msgStr}F`); break;
                    case "temp/289fa756b5013c68": updateHTML("achigh", `High AC Temp: ${msgStr}F`); break;
                    case "temp/2874913c46200105": updateHTML("aclow", `Low AC Temp: ${msgStr}F`); break;
                    case "water/Gal": updateHTML("gal", `Gallons: ${msgStr}`); break;
                    case "water/GPM": updateHTML("gpm", `${msgStr} GPM`); break;
                    case "hvac/controlTempF": updateHTML("t", `Controller temperature: ${parseFloat(msgStr).toFixed(1)}F`); break;
                    case "temp/room1/rh": updateHTML("rh", `RH: ${msgStr}%`); break;
                    case "temp/room1/dewF": updateHTML("dew", `DEW: ${msgStr}F`); break;
                    case "hvac/coolTime": updateHTML("cool", `Cool Runtime: ${msgStr} Min`); break;
                    case "hvac/heatTime": updateHTML("heat", `Heat Runtime: ${msgStr} Min`); break;

                    case "power/kWh":
                        const kwh = Number(msgStr);
                        let cost = 25;
                        if (kwh > 500) {
                            cost += (500 * 0.123131) + ((kwh - 500) * 0.104397);
                        } else {
                            cost += kwh * 0.123131;
                        }
                        cost += (kwh * 0.021983) + (kwh * 0.000390);
                        cost *= 1.07;

                        const now = new Date();
                        const month = now.getDate() > 6 ? now.getMonth() : now.getMonth() - 1;
                        const startOfCycle = new Date(now.getFullYear(), month, 7).getTime();
                        const endOfCycle = new Date(now.getFullYear(), month + 1, 7).getTime();
                        
                        const projectedkWh = kwh / (now.getTime() - startOfCycle) * (endOfCycle - startOfCycle);
                        let projectedCost = 25;
                        if (projectedkWh > 500) {
                            projectedCost += (500 * 0.123131) + ((projectedkWh - 500) * 0.104397);
                        } else {
                            projectedCost += projectedkWh * 0.123131;
                        }
                        projectedCost += (projectedkWh * 0.021983) + (projectedkWh * 0.000390);
                        projectedCost *= 1.07;

                        updateHTML("kWh", `${msgStr} kWh @ $${cost.toFixed(2)}<br>Projected Monthly Cost: ${projectedkWh.toFixed(2)}kWh @ $${projectedCost.toFixed(2)}`);
                        break;
                }
            });
        });
    </script>
</body>
</html>
